<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_diagram.css">
<title>PERT network, twelve activities, in the synopsis's style</title>
<style>
  /* The report's own twelve-activity network, drawn with the synopsis's
   * elements: rounded boxes, one light blue outline on all of them, and the
   * fill carrying the meaning. Colours sampled from the synopsis's images:
   *   outline #6DB1FF, fills #CFE4FF on the critical chain, #C3F7C8 on the
   *   two activities that carry float, #FFD9D9 on the final deliverable.
   *
   * Ten activities lie on one chain, so the boxes carry the letter and the
   * expected time and the names are set in the table beneath. Names inside
   * boxes this narrow would have to be set at about five points, which is
   * not readable in a bound copy. */
  .box { fill: #CFE4FF; stroke: #6DB1FF; stroke-width: 2; }
  .box.float { fill: #C3F7C8; }
  .box.deliv { fill: #FFD9D9; }
  .ltr { font-size: 17px; font-weight: 700; fill: #111; }
  .du { font-size: 11px; fill: #333; }
  .arc { stroke: #111; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
  .th { font-size: 11.5px; font-weight: 700; fill: #111; }
  .td { font-size: 11.5px; fill: #111; }
  .td-l { font-size: 11.5px; font-weight: 700; fill: #111; }
  .rule { stroke: #bbb; stroke-width: 1.2; }
  .divide { stroke: #ddd; stroke-width: 1; }
  .sum { font-size: 12px; font-weight: 700; fill: #111; }
  .sum-n { font-size: 11.5px; fill: #333; }
  .key { font-size: 11px; fill: #111; }
</style>
</head>
<body>
<div id="sheet">
<!-- The viewBox crops 40px of dead space above the D box and adds 10px under
     the last line of the summary, rather than moving every coordinate. -->
<svg width="1190" height="600" viewBox="0 40 1190 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
  </defs>

  <!-- ===================== the network ====================================
       Ten boxes on the chain at y 170..228, pitch 114. D sits above it
       between C and H, J below it between H and K. -->

  <rect class="box" x="30" y="170" width="84" height="58" rx="6"/>
  <text class="ltr mid" x="72" y="196">A</text>
  <text class="du mid"  x="72" y="214">4 d</text>

  <rect class="box" x="144" y="170" width="84" height="58" rx="6"/>
  <text class="ltr mid" x="186" y="196">B</text>
  <text class="du mid"  x="186" y="214">6 d</text>

  <rect class="box" x="258" y="170" width="84" height="58" rx="6"/>
  <text class="ltr mid" x="300" y="196">C</text>
  <text class="du mid"  x="300" y="214">4 d</text>

  <rect class="box float" x="372" y="70" width="84" height="58" rx="6"/>
  <text class="ltr mid" x="414" y="96">D</text>
  <text class="du mid"  x="414" y="114">6 d</text>

  <rect class="box" x="372" y="170" width="84" height="58" rx="6"/>
  <text class="ltr mid" x="414" y="196">E</text>
  <text class="du mid"  x="414" y="214">13 d</text>

  <rect class="box" x="486" y="170" width="84" height="58" rx="6"/>
  <text class="ltr mid" x="528" y="196">F</text>
  <text class="du mid"  x="528" y="214">6 d</text>

  <rect class="box" x="600" y="170" width="84" height="58" rx="6"/>
  <text class="ltr mid" x="642" y="196">G</text>
  <text class="du mid"  x="642" y="214">12 d</text>

  <rect class="box" x="714" y="170" width="84" height="58" rx="6"/>
  <text class="ltr mid" x="756" y="196">H</text>
  <text class="du mid"  x="756" y="214">12 d</text>

  <rect class="box" x="828" y="170" width="84" height="58" rx="6"/>
  <text class="ltr mid" x="870" y="196">I</text>
  <text class="du mid"  x="870" y="214">12 d</text>

  <rect class="box float" x="828" y="270" width="84" height="58" rx="6"/>
  <text class="ltr mid" x="870" y="296">J</text>
  <text class="du mid"  x="870" y="314">4 d</text>

  <rect class="box" x="942" y="170" width="84" height="58" rx="6"/>
  <text class="ltr mid" x="984" y="196">K</text>
  <text class="du mid"  x="984" y="214">5 d</text>

  <rect class="box deliv" x="1056" y="170" width="84" height="58" rx="6"/>
  <text class="ltr mid" x="1098" y="196">L</text>
  <text class="du mid"  x="1098" y="214">11 d</text>

  <!-- ===================== the dependencies =============================== -->
  <path class="arc" d="M 114 199 L 144 199"/>
  <path class="arc" d="M 228 199 L 258 199"/>
  <path class="arc" d="M 342 199 L 372 199"/>
  <path class="arc" d="M 456 199 L 486 199"/>
  <path class="arc" d="M 570 199 L 600 199"/>
  <path class="arc" d="M 684 199 L 714 199"/>
  <path class="arc" d="M 798 199 L 828 199"/>
  <path class="arc" d="M 912 199 L 942 199"/>
  <path class="arc" d="M 1026 199 L 1056 199"/>

  <!-- C up into D, D across into H: authentication is needed by the chat -->
  <path class="arc" d="M 300 170 L 300 99 L 372 99"/>
  <path class="arc" d="M 456 99 L 756 99 L 756 170"/>

  <!-- H down into J, J back up into K -->
  <path class="arc" d="M 756 228 L 756 299 L 828 299"/>
  <path class="arc" d="M 912 299 L 984 299 L 984 228"/>

  <!-- ===================== key ============================================ -->
  <rect class="box" x="30" y="352" width="24" height="14" rx="4"/>
  <text class="key" x="64" y="363">on the critical path</text>
  <rect class="box float" x="200" y="352" width="24" height="14" rx="4"/>
  <text class="key" x="234" y="363">carries float</text>
  <rect class="box deliv" x="340" y="352" width="24" height="14" rx="4"/>
  <text class="key" x="374" y="363">the deliverable posted on 15 September</text>
  <text class="key end" x="1160" y="363">t&#8337; = (o + 4m + p) / 6, rounded to whole days</text>

  <!-- ===================== the three-point estimates ====================== -->
  <text class="sum" x="30" y="394">Three-point estimates, in calendar days</text>

  <text class="th" x="42"  y="420">activity</text>
  <text class="th end" x="440" y="420">o &#8211; m &#8211; p</text>
  <text class="th end" x="500" y="420">t&#8337;</text>
  <text class="th end" x="570" y="420">&#963;&#178;</text>
  <text class="th" x="632" y="420">activity</text>
  <text class="th end" x="1030" y="420">o &#8211; m &#8211; p</text>
  <text class="th end" x="1090" y="420">t&#8337;</text>
  <text class="th end" x="1160" y="420">&#963;&#178;</text>
  <path class="rule" d="M 30 428 L 1160 428"/>
  <path class="divide" d="M 600 400 L 600 570"/>

  <text class="td-l" x="42" y="450">A</text>
  <text class="td"   x="66" y="450">Requirement study and synopsis approval</text>
  <text class="td end" x="440" y="450">2 &#8211; 4 &#8211; 6</text>
  <text class="td end" x="500" y="450">4</text>
  <text class="td end" x="570" y="450">0.44</text>
  <text class="td-l" x="632" y="450">G</text>
  <text class="td"   x="656" y="450">Retrieval and the RAG engine</text>
  <text class="td end" x="1030" y="450">9 &#8211; 12 &#8211; 17</text>
  <text class="td end" x="1090" y="450">12</text>
  <text class="td end" x="1160" y="450">1.78</text>

  <text class="td-l" x="42" y="476">B</text>
  <text class="td"   x="66" y="476">Environment and technology trial</text>
  <text class="td end" x="440" y="476">4 &#8211; 6 &#8211; 9</text>
  <text class="td end" x="500" y="476">6</text>
  <text class="td end" x="570" y="476">0.69</text>
  <text class="td-l" x="632" y="476">H</text>
  <text class="td"   x="656" y="476">Chat, conversations and citations</text>
  <text class="td end" x="1030" y="476">9 &#8211; 12 &#8211; 16</text>
  <text class="td end" x="1090" y="476">12</text>
  <text class="td end" x="1160" y="476">1.36</text>

  <text class="td-l" x="42" y="502">C</text>
  <text class="td"   x="66" y="502">Database schema and ORM models</text>
  <text class="td end" x="440" y="502">3 &#8211; 4 &#8211; 6</text>
  <text class="td end" x="500" y="502">4</text>
  <text class="td end" x="570" y="502">0.25</text>
  <text class="td-l" x="632" y="502">I</text>
  <text class="td"   x="656" y="502">Projects, settings and eleven languages</text>
  <text class="td end" x="1030" y="502">9 &#8211; 12 &#8211; 16</text>
  <text class="td end" x="1090" y="502">12</text>
  <text class="td end" x="1160" y="502">1.36</text>

  <text class="td-l" x="42" y="528">D</text>
  <text class="td"   x="66" y="528">Authentication and access control</text>
  <text class="td end" x="440" y="528">4 &#8211; 6 &#8211; 9</text>
  <text class="td end" x="500" y="528">6</text>
  <text class="td end" x="570" y="528">0.69</text>
  <text class="td-l" x="632" y="528">J</text>
  <text class="td"   x="656" y="528">Admin dashboard and usage figures</text>
  <text class="td end" x="1030" y="528">3 &#8211; 4 &#8211; 6</text>
  <text class="td end" x="1090" y="528">4</text>
  <text class="td end" x="1160" y="528">0.25</text>

  <text class="td-l" x="42" y="554">E</text>
  <text class="td"   x="66" y="554">Upload, extraction, OCR and chunking</text>
  <text class="td end" x="440" y="554">10 &#8211; 13 &#8211; 18</text>
  <text class="td end" x="500" y="554">13</text>
  <text class="td end" x="570" y="554">1.78</text>
  <text class="td-l" x="632" y="554">K</text>
  <text class="td"   x="656" y="554">Testing and defect fixing</text>
  <text class="td end" x="1030" y="554">4 &#8211; 5 &#8211; 8</text>
  <text class="td end" x="1090" y="554">5</text>
  <text class="td end" x="1160" y="554">0.44</text>

  <text class="td-l" x="42" y="580">F</text>
  <text class="td"   x="66" y="580">Embedding and vector indexing</text>
  <text class="td end" x="440" y="580">4 &#8211; 6 &#8211; 9</text>
  <text class="td end" x="500" y="580">6</text>
  <text class="td end" x="570" y="580">0.69</text>
  <text class="td-l" x="632" y="580">L</text>
  <text class="td"   x="656" y="580">Screen captures, manual and project report</text>
  <text class="td end" x="1030" y="580">8 &#8211; 11 &#8211; 15</text>
  <text class="td end" x="1090" y="580">11</text>
  <text class="td end" x="1160" y="580">1.36</text>

  <path class="rule" d="M 30 594 L 1160 594"/>

  <text class="sum" x="30" y="614">Critical path A &#8594; B &#8594; C &#8594; E &#8594; F &#8594; G &#8594; H &#8594; I &#8594; K &#8594; L = 85 days, 22 June to 15 September 2026.</text>
  <text class="sum-n" x="30" y="628">&#931;&#963;&#178; on that chain is 10.2, so &#963; = 3.2 days. The expected finish is the posting date itself, so the chain
    carries no float; D and J are the only activities that do, 25 days and 8 days.</text>

</svg>
</div>
</body>
</html>
