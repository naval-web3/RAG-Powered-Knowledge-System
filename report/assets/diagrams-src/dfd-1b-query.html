<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_diagram.css">
<title>DFD Level 1 (b)</title>
<style>
  .proc-no { font-size: 15px; font-weight: 700; }
  .proc { font-size: 12.5px; }
  .store-id { font-size: 12px; font-weight: 700; }
  .store-name { font-size: 12.5px; }
</style>
</head>
<body>
<div id="sheet">
<svg width="1150" height="620" viewBox="0 0 1150 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
  </defs>

  <!-- ============ external entities ============ -->
  <rect class="shape fill" x="30" y="250" width="150" height="90"/>
  <text class="t b mid" x="105" y="282">Registered</text>
  <text class="t b mid" x="105" y="302">User</text>
  <text class="t-xs mid" x="105" y="322">external entity</text>

  <rect class="shape fill" x="950" y="300" width="170" height="80"/>
  <text class="t b mid" x="1035" y="330">Language Model</text>
  <text class="t b mid" x="1035" y="350">Provider</text>
  <text class="t-xs mid" x="1035" y="368">external entity</text>

  <!-- ============ processes ============ -->
  <circle class="shape" cx="300" cy="130" r="56"/>
  <text class="proc-no mid" x="300" y="118">7.0</text>
  <text class="proc mid" x="300" y="138">Manage Projects</text>
  <text class="proc mid" x="300" y="154">and Settings</text>

  <circle class="shape heavy" cx="430" cy="350" r="70"/>
  <text class="proc-no mid" x="430" y="336">4.0</text>
  <text class="proc mid" x="430" y="356">Answer Question</text>
  <text class="proc mid" x="430" y="372">(RAG Engine)</text>

  <circle class="shape" cx="770" cy="150" r="56"/>
  <text class="proc-no mid" x="770" y="138">5.0</text>
  <text class="proc mid" x="770" y="158">Manage</text>
  <text class="proc mid" x="770" y="174">Conversations</text>

  <!-- ============ data stores ============ -->
  <g>
    <path class="store-line" d="M 470 96 L 660 96 M 470 136 L 660 136 M 470 96 L 470 136 M 514 96 L 514 136"/>
    <text class="store-id" x="483" y="122">D7</text>
    <text class="store-name" x="526" y="122">projects</text>

    <path class="store-line" d="M 470 176 L 660 176 M 470 216 L 660 216 M 470 176 L 470 216 M 514 176 L 514 216"/>
    <text class="store-id" x="483" y="202">D1</text>
    <text class="store-name" x="526" y="202">users</text>

    <path class="store-line" d="M 890 60 L 1140 60 M 890 100 L 1140 100 M 890 60 L 890 100 M 934 60 L 934 100"/>
    <text class="store-id" x="903" y="86">D5</text>
    <text class="store-name" x="946" y="86">conversations, messages</text>

    <path class="store-line" d="M 640 490 L 850 490 M 640 530 L 850 530 M 640 490 L 640 530 M 684 490 L 684 530"/>
    <text class="store-id" x="653" y="516">D4</text>
    <text class="store-name" x="696" y="516">vector store</text>

    <path class="store-line" d="M 300 560 L 510 560 M 300 600 L 510 600 M 300 560 L 300 600 M 344 560 L 344 600"/>
    <text class="store-id" x="313" y="586">D6</text>
    <text class="store-name" x="356" y="586">query_logs</text>

    <path class="store-line" d="M 700 240 L 890 240 M 700 280 L 890 280 M 700 240 L 700 280 M 744 240 L 744 280"/>
    <text class="store-id" x="713" y="266">D2</text>
    <text class="store-name" x="756" y="266">documents</text>
  </g>

  <!-- ============ flows ============ -->

  <!-- user -> 7.0 -->
  <path class="flow" d="M 180 268 L 226 268 L 226 142 L 244 142"/>
  <text class="flow-label" x="140" y="200">project, standing</text>
  <text class="flow-label" x="140" y="214">instructions,</text>
  <text class="flow-label" x="140" y="228">preferences</text>

  <!-- 7.0 -> D7 -->
  <path class="flow" d="M 352 108 L 470 108"/>
  <text class="flow-label mid" x="410" y="76">name, scope,</text>
  <text class="flow-label mid" x="410" y="90">linked documents</text>

  <!-- 7.0 -> D1 -->
  <path class="flow" d="M 348 160 L 420 160 L 420 196 L 470 196"/>
  <text class="flow-label" x="360" y="188">preferences</text>

  <!-- D7 -> 4.0 : the project supplies scope and instructions -->
  <path class="flow dashed" d="M 490 136 L 490 306 L 466 306"/>
  <text class="flow-label" x="386" y="292">instructions,</text>
  <text class="flow-label" x="386" y="306">document scope</text>

  <!-- user -> 4.0 -->
  <path class="flow" d="M 180 330 L 363 330"/>
  <text class="flow-label mid" x="272" y="320">question</text>

  <!-- 4.0 -> user -->
  <path class="flow" d="M 363 370 L 180 370"/>
  <text class="flow-label mid" x="272" y="390">answer with cited sources</text>

  <!-- 4.0 -> D4 -->
  <path class="flow" d="M 470 412 L 470 460 L 720 460 L 720 490"/>
  <text class="flow-label" x="560" y="454">query vector, document filter</text>

  <!-- D4 -> 4.0 -->
  <path class="flow" d="M 800 490 L 800 434 L 490 434 L 490 416"/>
  <text class="flow-label" x="560" y="428">top-k passages + metadata</text>

  <!-- 4.0 -> provider -->
  <path class="flow" d="M 500 342 L 950 342"/>
  <text class="flow-label mid" x="730" y="332">prompt: question + numbered passages</text>

  <!-- provider -> 4.0 -->
  <path class="flow" d="M 950 372 L 493 372"/>
  <text class="flow-label mid" x="730" y="392">generated answer text</text>

  <!-- 4.0 -> D6 -->
  <path class="flow" d="M 400 418 L 400 560"/>
  <text class="flow-label end" x="392" y="500">latency, provider,</text>
  <text class="flow-label end" x="392" y="514">model, chunks used</text>

  <!-- 4.0 reads D2 for the titles it cites -->
  <path class="flow" d="M 700 260 L 500 260 L 500 300"/>
  <text class="flow-label mid" x="600" y="252">document titles</text>

  <!-- 4.0 -> 5.0 -->
  <path class="flow" d="M 470 292 L 600 292 L 600 178 L 716 160"/>
  <text class="flow-label" x="530" y="286">question, answer, sources</text>

  <!-- 5.0 -> D5 -->
  <path class="flow" d="M 822 132 L 950 132 L 950 100"/>
  <text class="flow-label" x="838" y="126">message pair</text>

  <!-- D5 -> 5.0 -->
  <path class="flow" d="M 910 100 L 910 168 L 826 168"/>
  <text class="flow-label" x="840" y="186">history</text>

  <!-- user -> 5.0 -->
  <path class="flow" d="M 105 250 L 105 26 L 770 26 L 770 94"/>
  <text class="flow-label" x="300" y="20">open, rename, pin, search or delete a conversation</text>

  <!-- 5.0 -> user -->
  <path class="flow" d="M 726 122 L 690 122 L 690 50 L 150 50 L 150 250"/>
  <text class="flow-label" x="300" y="44">conversation list and stored history</text>
</svg>
</div>
</body>
</html>
