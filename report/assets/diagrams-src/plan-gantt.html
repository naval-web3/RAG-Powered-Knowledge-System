<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_diagram.css">
<title>Gantt chart, twelve activities, in the synopsis's style</title>
<style>
  /* The report's own twelve-activity schedule, drawn with the elements and the
   * palette of the approved synopsis. Colours sampled from the synopsis's own
   * images rather than guessed:
   *   #425CC8 critical, #00BF63 carries float, #F45318 the final deliverable,
   *   #E7E7E7 week columns, #F0F0F0 the activity panel.
   * Every bar also carries its duration in days, so the chart still reads if a
   * copy is run off in black and white. */
  .title-a { font-size: 21px; font-weight: 700; fill: #425CC8; }
  .title-b { font-size: 21px; font-weight: 700; fill: #F45318; }
  .panel { fill: #F0F0F0; }
  .col { fill: #E7E7E7; }
  .band { fill: #E7E7E7; }
  .hd { font-size: 11.5px; font-weight: 700; fill: #111; }
  .mo { font-size: 11.5px; font-weight: 700; fill: #111; }
  .dt { font-size: 10.5px; fill: #555; }
  .task { font-size: 11.5px; fill: #111; }
  .task-l { font-size: 11.5px; font-weight: 700; fill: #111; }
  .bar { stroke: none; }
  .bar.crit { fill: #425CC8; }
  .bar.float { fill: #00BF63; }
  .bar.deliv { fill: #F45318; }
  .slack { fill: none; stroke: #00BF63; stroke-width: 1.4; stroke-dasharray: 5 3; }
  .bar-t { font-size: 10.5px; font-weight: 700; fill: #fff; }
  .rule { stroke: #C8C8C8; stroke-width: 1; }
  .divide { stroke: #999; stroke-width: 1; }
  .ms { stroke: #111; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  .key { font-size: 11px; fill: #111; }
  .note { font-size: 10.5px; fill: #333; }
  .note-b { font-size: 10.5px; font-weight: 700; fill: #111; }
</style>
</head>
<body>
<div id="sheet">
<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">

  <!-- ===================== title, as the synopsis sets it ================= -->
  <text class="title-a" x="40" y="40">Project Timeline</text>
  <text class="title-b" x="40" y="68">Gantt Chart</text>

  <!-- ===================== key ============================================ -->
  <rect class="bar crit" x="700" y="22" width="26" height="13" rx="6"/>
  <text class="key" x="736" y="33">on the critical path</text>
  <rect class="bar float" x="700" y="44" width="26" height="13" rx="6"/>
  <text class="key" x="736" y="55">carries float, drawn at its earliest start</text>
  <rect class="bar deliv" x="700" y="66" width="26" height="13" rx="6"/>
  <text class="key" x="736" y="77">the deliverable posted on 15 September</text>
  <path class="slack" d="M 1000 28.5 L 1060 28.5"/>
  <text class="key" x="1070" y="33">float</text>

  <!-- ===================== calendar header ================================
       Thirteen weeks, 58px each, from 400 to 1154. One day is 58/7 px. -->
  <text class="hd" x="40" y="112">Phase &#8594;</text>
  <text class="hd" x="40" y="138">week beginning</text>

  <rect class="band" x="400" y="94" width="116" height="22" rx="4"/>
  <rect class="band" x="518" y="94" width="228" height="22" rx="4"/>
  <rect class="band" x="748" y="94" width="288" height="22" rx="4"/>
  <rect class="band" x="1038" y="94" width="116" height="22" rx="4"/>
  <text class="mo mid" x="458"  y="110">June</text>
  <text class="mo mid" x="632"  y="110">July</text>
  <text class="mo mid" x="892"  y="110">August</text>
  <text class="mo mid" x="1096" y="110">September</text>

  <text class="dt mid" x="429"  y="138">22</text>
  <text class="dt mid" x="487"  y="138">29</text>
  <text class="dt mid" x="545"  y="138">6</text>
  <text class="dt mid" x="603"  y="138">13</text>
  <text class="dt mid" x="661"  y="138">20</text>
  <text class="dt mid" x="719"  y="138">27</text>
  <text class="dt mid" x="777"  y="138">3</text>
  <text class="dt mid" x="835"  y="138">10</text>
  <text class="dt mid" x="893"  y="138">17</text>
  <text class="dt mid" x="951"  y="138">24</text>
  <text class="dt mid" x="1009" y="138">31</text>
  <text class="dt mid" x="1067" y="138">7</text>
  <text class="dt mid" x="1125" y="138">14</text>

  <path class="rule" d="M 40 146 L 1154 146"/>

  <!-- ===================== the grid ======================================= -->
  <rect class="panel" x="40" y="152" width="350" height="336" rx="10"/>

  <rect class="col" x="402"  y="152" width="54" height="336" rx="7"/>
  <rect class="col" x="460"  y="152" width="54" height="336" rx="7"/>
  <rect class="col" x="518"  y="152" width="54" height="336" rx="7"/>
  <rect class="col" x="576"  y="152" width="54" height="336" rx="7"/>
  <rect class="col" x="634"  y="152" width="54" height="336" rx="7"/>
  <rect class="col" x="692"  y="152" width="54" height="336" rx="7"/>
  <rect class="col" x="750"  y="152" width="54" height="336" rx="7"/>
  <rect class="col" x="808"  y="152" width="54" height="336" rx="7"/>
  <rect class="col" x="866"  y="152" width="54" height="336" rx="7"/>
  <rect class="col" x="924"  y="152" width="54" height="336" rx="7"/>
  <rect class="col" x="982"  y="152" width="54" height="336" rx="7"/>
  <rect class="col" x="1040" y="152" width="54" height="336" rx="7"/>
  <rect class="col" x="1098" y="152" width="54" height="336" rx="7"/>

  <!-- ===================== the twelve activities ==========================
       Row tops 152 to 460 in steps of 28; bars sit 5 below, 18 tall.
       x(day) = 400 + day * 8.2857 -->

  <text class="task-l" x="56" y="170">A</text>
  <text class="task"   x="80" y="170">Requirement study and synopsis approval</text>
  <rect class="bar crit" x="400.0" y="157" width="33.1" height="18" rx="9"/>
  <text class="bar-t mid" x="416.6" y="170">4 d</text>

  <text class="task-l" x="56" y="198">B</text>
  <text class="task"   x="80" y="198">Environment and technology trial</text>
  <rect class="bar crit" x="433.1" y="185" width="49.7" height="18" rx="9"/>
  <text class="bar-t mid" x="458.0" y="198">6 d</text>

  <text class="task-l" x="56" y="226">C</text>
  <text class="task"   x="80" y="226">Database schema and ORM models</text>
  <rect class="bar crit" x="482.9" y="213" width="33.1" height="18" rx="9"/>
  <text class="bar-t mid" x="499.4" y="226">4 d</text>

  <text class="task-l" x="56" y="254">D</text>
  <text class="task"   x="80" y="254">Authentication and access control</text>
  <rect class="bar float" x="516.0" y="241" width="49.7" height="18" rx="9"/>
  <text class="bar-t mid" x="540.9" y="254">6 d</text>
  <rect class="slack" x="565.7" y="241" width="207.2" height="18" rx="9"/>

  <text class="task-l" x="56" y="282">E</text>
  <text class="task"   x="80" y="282">Upload, extraction, OCR and chunking</text>
  <rect class="bar crit" x="516.0" y="269" width="107.7" height="18" rx="9"/>
  <text class="bar-t mid" x="569.9" y="282">13 d</text>

  <text class="task-l" x="56" y="310">F</text>
  <text class="task"   x="80" y="310">Embedding and vector indexing</text>
  <rect class="bar crit" x="623.7" y="297" width="49.7" height="18" rx="9"/>
  <text class="bar-t mid" x="648.6" y="310">6 d</text>

  <text class="task-l" x="56" y="338">G</text>
  <text class="task"   x="80" y="338">Retrieval and the RAG engine</text>
  <rect class="bar crit" x="673.4" y="325" width="99.4" height="18" rx="9"/>
  <text class="bar-t mid" x="723.1" y="338">12 d</text>

  <text class="task-l" x="56" y="366">H</text>
  <text class="task"   x="80" y="366">Chat, conversations and citations</text>
  <rect class="bar crit" x="772.9" y="353" width="99.4" height="18" rx="9"/>
  <text class="bar-t mid" x="822.6" y="366">12 d</text>

  <text class="task-l" x="56" y="394">I</text>
  <text class="task"   x="80" y="394">Projects, settings and eleven languages</text>
  <rect class="bar crit" x="872.3" y="381" width="99.4" height="18" rx="9"/>
  <text class="bar-t mid" x="922.0" y="394">12 d</text>

  <text class="task-l" x="56" y="422">J</text>
  <text class="task"   x="80" y="422">Admin dashboard and usage figures</text>
  <rect class="bar float" x="872.3" y="409" width="33.1" height="18" rx="9"/>
  <text class="bar-t mid" x="888.9" y="422">4 d</text>
  <rect class="slack" x="905.4" y="409" width="66.3" height="18" rx="9"/>

  <text class="task-l" x="56" y="450">K</text>
  <text class="task"   x="80" y="450">Testing and defect fixing</text>
  <rect class="bar crit" x="971.7" y="437" width="41.4" height="18" rx="9"/>
  <text class="bar-t mid" x="992.4" y="450">5 d</text>

  <text class="task-l" x="56" y="478">L</text>
  <text class="task"   x="80" y="478">Screen captures, manual and project report</text>
  <rect class="bar deliv" x="1013.1" y="465" width="91.1" height="18" rx="9"/>
  <text class="bar-t mid" x="1058.7" y="478">11 d</text>

  <!-- ===================== the posting date ===============================
       Day 85 is 15 September 2026, where the chain ends. -->
  <path class="ms" d="M 1104.3 146 L 1104.3 488"/>
  <path class="shape" d="M 1104.3 494 l 7 8 l -7 8 l -7 -8 z"/>

  <!-- ===================== footnote ======================================= -->
  <text class="note" x="40" y="528">Bar lengths are the expected times t&#8337; from the three-point estimates in the
    PERT network. The dashed extension on D and J is the float each carries; every</text>
  <text class="note" x="40" y="544">other activity is on the critical chain, which runs 85 days from 22 June to
    15 September 2026 and has no float at all.</text>
  <text class="note-b end" x="1160" y="528">posted by 15 September 2026</text>

</svg>
</div>
</body>
</html>
