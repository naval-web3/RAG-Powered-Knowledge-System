<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_diagram.css">
<title>Gantt chart</title>
<style>
  .grid { stroke: #c8c8c8; stroke-width: 1; }
  .grid.month { stroke: #777; stroke-width: 1.2; }
  .frame { fill: none; stroke: #111; stroke-width: 1.6; }
  .band { fill: #ececec; stroke: #111; stroke-width: 1.2; }
  .hd { font-size: 11.5px; font-weight: 700; }
  .wk { font-size: 10.5px; fill: #333; }
  .row-alt { fill: #f7f7f7; }
  .task { font-size: 11.5px; }
  .task-l { font-size: 11.5px; font-weight: 700; }
  .bar { fill: #ececec; stroke: #111; stroke-width: 1.4; }
  .bar.crit { fill: #9a9a9a; stroke-width: 1.8; }
  .days { font-size: 10px; fill: #333; }
  .ms { stroke: #111; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  .ms-t { font-size: 10.5px; font-weight: 700; }
  .key { font-size: 10.5px; }
</style>
</head>
<body>
<div id="sheet">
<svg width="1180" height="530" viewBox="0 0 1180 530" xmlns="http://www.w3.org/2000/svg">

  <!-- alternating row tints, drawn first so everything sits on top -->
  <rect class="row-alt" x="40" y="134" width="1094" height="30"/>

  <text class="wk mid" x="583"  y="94">13</text>

  <text class="wk mid" x="1047" y="94">7</text>

  <rect class="bar" x="220" y="484" width="34" height="14"/>

</svg>
</div>
</body>
</html>
