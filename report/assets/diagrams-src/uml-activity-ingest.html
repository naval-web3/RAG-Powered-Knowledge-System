<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_diagram.css">
<title>Activity diagram - uploading and indexing a document</title>
<style>
  .lane { fill: none; stroke: #3A414A; stroke-width: 1.4; }
  .lane-hd { fill: #C3F7C8; stroke: #6DB1FF; stroke-width: 1.4; }
  .lane-t { font-size: 12px; font-weight: 700; }
  .act { fill: #CFE4FF; stroke: #6DB1FF; stroke-width: 1.6; rx: 9; ry: 9; }
  .act.vs { fill: #C3F7C8; }
  .dec { fill: #CFE4FF; stroke: #6DB1FF; stroke-width: 1.6; }
  .node { fill: #CFE4FF; stroke: #6DB1FF; stroke-width: 2; }
  .node.filled { fill: #3A414A; }
  .t { font-size: 11px; }
  .pct { font-size: 10px; fill: #5A6472; }
  .flow { stroke: #3A414A; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .g { font-size: 10.5px; font-style: italic; }
</style>
</head>
<body>
<div id="sheet">
<svg width="620" height="890" viewBox="0 0 620 890" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A414A"/>
    </marker>
  </defs>

  <!-- ===================== swim lanes ===================== -->
  <rect class="lane-hd" x="20" y="20" width="150" height="28"/>
  <rect class="lane-hd" x="170" y="20" width="430" height="28"/>
  <text class="lane-t mid" x="95" y="39">Browser</text>
  <text class="lane-t mid" x="385" y="39">Server &#8212; api.documents, then the app.worker process</text>
  <rect class="lane" x="20" y="48" width="150" height="820"/>
  <rect class="lane" x="170" y="48" width="430" height="820"/>

  <!-- ===================== nodes ===================== -->
  <circle class="node filled" cx="95" cy="70" r="8"/>

  <rect class="act" x="25" y="88" width="140" height="40"/>
  <text class="t mid" x="95" y="104">choose a file and</text>
  <text class="t mid" x="95" y="118">press Upload</text>

  <rect class="act" x="220" y="88" width="220" height="40"/>
  <text class="t mid" x="330" y="104">check the extension against</text>
  <text class="t mid" x="330" y="118">pdf, docx, txt, md and the size limit</text>

  <path class="dec" d="M 330 144 L 415 170 L 330 196 L 245 170 Z"/>
  <text class="t mid" x="330" y="174">accepted?</text>

  <rect class="act" x="25" y="150" width="140" height="40"/>
  <text class="t mid" x="95" y="166">show why the file</text>
  <text class="t mid" x="95" y="180">was refused</text>

  <circle class="node" cx="95" cy="222" r="10"/>
  <circle class="node filled" cx="95" cy="222" r="5.5"/>

  <rect class="act" x="220" y="216" width="220" height="46"/>
  <text class="t mid" x="330" y="234">store the file and INSERT a</text>
  <text class="t mid" x="330" y="250">documents row, status = pending</text>

  <rect class="act" x="220" y="290" width="220" height="46"/>
  <text class="t mid" x="330" y="308">answer 201, then spawn app.worker</text>
  <text class="t mid" x="330" y="324">as a separate operating-system process</text>

  <rect class="act" x="25" y="360" width="140" height="52"/>
  <text class="t mid" x="95" y="378">poll the document</text>
  <text class="t mid" x="95" y="392">once a second and</text>
  <text class="t mid" x="95" y="406">draw the bar</text>

  <rect class="act" x="220" y="364" width="220" height="44"/>
  <text class="t mid" x="330" y="382">read the file, page by page</text>
  <text class="pct mid" x="330" y="398">progress 4 &#8594; 35 %</text>

  <path class="dec" d="M 330 424 L 425 452 L 330 480 L 235 452 Z"/>
  <text class="t mid" x="330" y="449">did the pages give</text>
  <text class="t mid" x="330" y="463">any selectable text?</text>

  <rect class="act" x="450" y="428" width="145" height="48"/>
  <text class="t mid" x="522" y="446">OCR every page</text>
  <text class="t mid" x="522" y="460">image</text>
  <text class="pct mid" x="522" y="472">35 &#8594; 60 %</text>

  <rect class="act" x="220" y="500" width="220" height="58"/>
  <text class="t mid" x="330" y="518">split into sections, then into</text>
  <text class="t mid" x="330" y="532">1000-character chunks that</text>
  <text class="t mid" x="330" y="546">overlap by 200</text>

  <path class="dec" d="M 330 576 L 415 602 L 330 628 L 245 602 Z"/>
  <text class="t mid" x="330" y="606">any chunks at all?</text>

  <rect class="act" x="450" y="578" width="145" height="48"/>
  <text class="t mid" x="522" y="596">write the reason on</text>
  <text class="t mid" x="522" y="610">the row</text>
  <text class="t mid" x="522" y="622">status = failed</text>

  <circle class="node" cx="522" cy="662" r="10"/>
  <circle class="node filled" cx="522" cy="662" r="5.5"/>

  <rect class="act vs" x="220" y="648" width="220" height="58"/>
  <text class="t mid" x="330" y="666">embed in batches of 64, then</text>
  <text class="t mid" x="330" y="680">index each batch into Chroma</text>
  <text class="t mid" x="330" y="694">with its page and section</text>

  <rect class="act" x="220" y="726" width="220" height="44"/>
  <text class="t mid" x="330" y="744">chunk_count = total, status = done</text>
  <text class="pct mid" x="330" y="760">progress 100 %</text>

  <rect class="act" x="25" y="790" width="140" height="52"/>
  <text class="t mid" x="95" y="808">the bar completes;</text>
  <text class="t mid" x="95" y="822">the document can</text>
  <text class="t mid" x="95" y="836">now be searched</text>

  <!-- ===================== flows ===================== -->
  <path class="flow" d="M 95 78 L 95 86"/>
  <path class="flow" d="M 165 108 L 218 108"/>
  <path class="flow" d="M 330 128 L 330 142"/>

  <path class="flow" d="M 245 170 L 167 170"/>
  <text class="g mid" x="206" y="163">no</text>

  <path class="flow" d="M 95 190 L 95 210"/>

  <path class="flow" d="M 330 196 L 330 214"/>
  <text class="g" x="336" y="209">yes</text>

  <path class="flow" d="M 330 262 L 330 288"/>
  <path class="flow" d="M 330 336 L 330 362"/>

  <!-- the browser starts watching as soon as the API has answered -->
  <path class="flow" d="M 220 313 L 190 313 L 190 386 L 167 386"/>
  <text class="g" x="196" y="350">polling starts</text>

  <path class="flow" d="M 330 408 L 330 422"/>

  <path class="flow" d="M 425 452 L 448 452"/>
  <text class="g mid" x="436" y="445">no</text>

  <!-- OCR rejoins the main flow below the decision. It merges ONTO the "yes"
       line and carries no arrowhead of its own: a head here would have six
       units of run and would be drawn back over the corner, and two heads
       arriving at one point read as two flows rather than one merged. -->
  <path class="flow" style="marker-end:none" d="M 522 476 L 522 492 L 334 492"/>

  <path class="flow" d="M 330 480 L 330 498"/>
  <text class="g end" x="324" y="492">yes</text>

  <path class="flow" d="M 330 558 L 330 574"/>

  <path class="flow" d="M 415 602 L 448 602"/>
  <text class="g mid" x="431" y="595">no</text>

  <path class="flow" d="M 522 626 L 522 650"/>

  <path class="flow" d="M 330 628 L 330 646"/>
  <text class="g" x="336" y="641">yes</text>

  <path class="flow" d="M 330 706 L 330 724"/>

  <path class="flow" d="M 220 748 L 95 748 L 95 788"/>

  <circle class="node" cx="95" cy="862" r="10"/>
  <circle class="node filled" cx="95" cy="862" r="5.5"/>
  <path class="flow" d="M 95 842 L 95 850"/>
</svg>
</div>
</body>
</html>
