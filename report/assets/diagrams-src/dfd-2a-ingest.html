<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_diagram.css">
<style>
  /* The synopsis colours the system's own work green and what lies outside it
   * blue. A process is .shape here and an external entity is .shape.fill, so
   * the shared palette is swapped back for these sheets to agree with it. */
  .shape { fill: #C3F7C8; }
  .shape.fill { fill: #CFE4FF; }
</style>
<title>DFD Level 2 - process 3.0, Process Document</title>
<style>
  .proc-no { font-size: 15px; font-weight: 700; }
  .proc { font-size: 12.5px; }
  .store-id { font-size: 12px; font-weight: 700; }
  .store-name { font-size: 12.5px; }
</style>
</head>
<body>
<div id="sheet">
<svg width="1220" height="545" viewBox="0 0 1220 545" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A414A"/>
    </marker>
  </defs>

  <!-- ============ data stores ============ -->
  <g>
    <path class="store-line" d="M 30 150 L 240 150 M 30 190 L 240 190 M 30 150 L 30 190 M 74 150 L 74 190"/>
    <text class="store-id" x="43" y="176">D3</text>
    <text class="store-name" x="86" y="176">upload store</text>

    <path class="store-line" d="M 940 40 L 1210 40 M 940 80 L 1210 80 M 940 40 L 940 80 M 984 40 L 984 80"/>
    <text class="store-id" x="953" y="66">D4</text>
    <text class="store-name" x="996" y="66">vector store</text>

    <path class="store-line" d="M 300 470 L 1160 470 M 300 510 L 1160 510 M 300 470 L 300 510 M 344 470 L 344 510"/>
    <text class="store-id" x="313" y="496">D2</text>
    <text class="store-name" x="356" y="496">documents</text>
  </g>

  <!-- ============ processes ============ -->
  <circle class="shape" cx="360" cy="170" r="56"/>
  <text class="proc-no mid" x="360" y="158">3.1</text>
  <text class="proc mid" x="360" y="178">Extract</text>
  <text class="proc mid" x="360" y="194">Text</text>

  <circle class="shape" cx="200" cy="330" r="56"/>
  <text class="proc-no mid" x="200" y="318">3.2</text>
  <text class="proc mid" x="200" y="338">Recognise</text>
  <text class="proc mid" x="200" y="354">Scanned Pages</text>

  <circle class="shape" cx="580" cy="170" r="56"/>
  <text class="proc-no mid" x="580" y="158">3.3</text>
  <text class="proc mid" x="580" y="178">Split into</text>
  <text class="proc mid" x="580" y="194">Chunks</text>

  <circle class="shape" cx="800" cy="170" r="56"/>
  <text class="proc-no mid" x="800" y="158">3.4</text>
  <text class="proc mid" x="800" y="178">Embed</text>
  <text class="proc mid" x="800" y="194">Chunks</text>

  <circle class="shape heavy" cx="1020" cy="170" r="56"/>
  <text class="proc-no mid" x="1020" y="158">3.5</text>
  <text class="proc mid" x="1020" y="178">Index</text>
  <text class="proc mid" x="1020" y="194">Chunks</text>

  <!-- ============ flows ============ -->
  <path class="flow" d="M 240 170 L 302 170"/>
  <text class="flow-label mid" x="271" y="160">stored file</text>

  <path class="flow" d="M 416 170 L 522 170"/>
  <text class="flow-label mid" x="469" y="112">page text, with the page it came from</text>

  <path class="flow dashed" d="M 322 208 L 200 208 L 200 272"/>
  <text class="flow-label mid" x="262" y="200">no text layer</text>
  <text class="flow-label end" x="192" y="236">page images</text>

  <path class="flow" d="M 256 330 L 500 330 L 500 209 L 540 209"/>
  <text class="flow-label" x="260" y="322">recognised text</text>

  <path class="flow" d="M 636 170 L 742 170"/>
  <text class="flow-label mid" x="689" y="112">chunks with page and section</text>

  <path class="flow" d="M 856 170 L 962 170"/>
  <text class="flow-label mid" x="909" y="112">chunks and their 384-number vectors</text>

  <path class="flow" d="M 1020 114 L 1020 82"/>
  <text class="flow-label" x="1032" y="102">vector, text and its metadata</text>

  <!-- every step writes its own progress back onto the row -->
  <path class="flow" d="M 360 226 L 360 468"/>
  <text class="flow-label" x="368" y="358">stage = extracting,</text>
  <text class="flow-label" x="368" y="372">4 &#8594; 35 %</text>

  <path class="flow" d="M 580 226 L 580 468"/>
  <text class="flow-label" x="588" y="330">stage = chunking,</text>
  <text class="flow-label" x="588" y="344">60 &#8594; 68 %</text>

  <path class="flow" d="M 800 226 L 800 468"/>
  <text class="flow-label" x="808" y="330">stage = embedding,</text>
  <text class="flow-label" x="808" y="344">68 &#8594; 85 %</text>

  <path class="flow" d="M 1020 226 L 1020 468"/>
  <text class="flow-label" x="1030" y="330">stage = indexing,</text>
  <text class="flow-label" x="1030" y="344">85 &#8594; 99 %, then</text>
  <text class="flow-label" x="1030" y="358">chunk_count = total</text>

  <path class="flow" d="M 200 386 L 200 490 L 298 490"/>
  <text class="flow-label" x="208" y="418">stage = ocr,</text>
  <text class="flow-label" x="208" y="432">35 &#8594; 60 %</text>
</svg>
</div>
</body>
</html>
