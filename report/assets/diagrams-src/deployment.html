<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_diagram.css">
<title>Deployment architecture</title>
<style>
  .node { fill: #CFE4FF; stroke: #6DB1FF; stroke-width: 2; }
  .host { fill: #fff; stroke: #6DB1FF; stroke-width: 2; stroke-dasharray: 8 5; }
  .grp  { fill: #EDF5FF; stroke: #6DB1FF; stroke-width: 1.6; stroke-dasharray: 5 4; }
  .art  { fill: #C3F7C8; stroke: #6DB1FF; stroke-width: 1.6; }
  .st   { font-size: 11px; font-style: italic; fill: #5A6472; }
  .nm   { font-size: 14px; font-weight: 700; }
  .sub  { font-size: 11.5px; fill: #5A6472; }
  .link { stroke: #3A414A; stroke-width: 1.6; fill: none;
          marker-end: url(#arrow); marker-start: url(#arrow); }
  .link.one { marker-start: none; }
  .link.opt { stroke-dasharray: 6 4; }
  .lb   { font-size: 11px; }
  .lb-d { font-size: 11px; fill: #5A6472; font-style: italic; }
</style>
</head>
<body>
<div id="sheet">
<svg width="1150" height="520" viewBox="0 0 1150 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A414A"/>
    </marker>
  </defs>

  <!-- ===================== the host boundary ===================== -->
  <rect class="host" x="250" y="30" width="740" height="460"/>
  <text class="st" x="266" y="52">&#171;device&#187;</text>
  <text class="nm" x="266" y="72">Application host</text>

  <!-- ===================== the client ===================== -->
  <rect class="node" x="20" y="190" width="170" height="130"/>
  <text class="st mid" x="105" y="214">&#171;device&#187;</text>
  <text class="nm mid" x="105" y="234">Client machine</text>
  <rect class="art" x="38" y="250" width="134" height="52"/>
  <text class="sub mid" x="105" y="270">React single-page</text>
  <text class="sub mid" x="105" y="286">application</text>

  <!-- ===================== the two processes ===================== -->
  <rect class="node" x="285" y="110" width="210" height="140"/>
  <text class="st mid" x="390" y="134">&#171;process&#187;</text>
  <text class="nm mid" x="390" y="154">Uvicorn</text>
  <rect class="art" x="303" y="170" width="174" height="66"/>
  <text class="sub mid" x="390" y="190">FastAPI application</text>
  <text class="sub mid" x="390" y="206">routers &#183; services</text>
  <text class="sub mid" x="390" y="222">providers &#183; ORM</text>

  <rect class="node" x="285" y="320" width="210" height="130"/>
  <text class="st mid" x="390" y="344">&#171;process&#187;</text>
  <text class="nm mid" x="390" y="364">app.worker</text>
  <text class="sub mid" x="390" y="388">one per upload, which</text>
  <text class="sub mid" x="390" y="404">exits when it is done</text>
  <text class="sub mid" x="390" y="428">extract &#183; OCR &#183; chunk &#183; embed</text>

  <!-- ===================== storage ===================== -->
  <rect class="grp" x="558" y="110" width="264" height="350"/>
  <text class="st" x="572" y="132">&#171;device&#187; database and disk, on this machine</text>

  <rect class="node" x="578" y="152" width="224" height="72"/>
  <text class="nm mid" x="690" y="180">PostgreSQL 16</text>
  <text class="sub mid" x="690" y="202">eight tables, TCP 5432</text>

  <rect class="node" x="578" y="250" width="224" height="72"/>
  <text class="nm mid" x="690" y="278">ChromaDB</text>
  <text class="sub mid" x="690" y="300">embedded, on disk</text>

  <rect class="node" x="578" y="348" width="224" height="72"/>
  <text class="nm mid" x="690" y="376">Upload store</text>
  <text class="sub mid" x="690" y="398">the original files</text>

  <!-- ===================== model providers ===================== -->
  <rect class="node" x="858" y="160" width="118" height="130"/>
  <text class="st mid" x="917" y="184">&#171;process&#187;</text>
  <text class="nm mid" x="917" y="204">Ollama</text>
  <text class="sub mid" x="917" y="228">llama3.2:3b</text>
  <text class="sub mid" x="917" y="244">granite4:micro</text>
  <text class="sub mid" x="917" y="266">port 11434</text>

  <rect class="node" x="1012" y="330" width="132" height="120"/>
  <text class="st mid" x="1078" y="354">&#171;external&#187;</text>
  <text class="nm mid" x="1078" y="374">OpenAI API</text>
  <text class="sub mid" x="1078" y="398">optional, chosen</text>
  <text class="sub mid" x="1078" y="414">per question</text>
  <text class="sub mid" x="1078" y="436">never required</text>

  <!-- ===================== links ===================== -->
  <path class="link" d="M 192 235 L 283 195"/>
  <text class="lb" x="30" y="160">HTTP / JSON</text>
  <text class="lb-d" x="30" y="174">REST, bearer token</text>

  <path class="link" d="M 497 186 L 556 186"/>
  <path class="link" d="M 497 384 L 556 384"/>

  <path class="link one" d="M 390 252 L 390 318"/>
  <text class="lb-d" x="400" y="278">spawns one</text>
  <text class="lb-d" x="400" y="292">for each upload</text>

  <path class="link" d="M 400 108 L 400 92 L 917 92 L 917 158"/>
  <text class="lb-d mid" x="640" y="84">HTTP on the loopback interface</text>

  <path class="link opt" d="M 440 108 L 440 62 L 1078 62 L 1078 328"/>
  <text class="lb-d mid" x="760" y="54">HTTPS &#8212; the only traffic that ever leaves this machine</text>
</svg>
</div>
</body>
</html>
